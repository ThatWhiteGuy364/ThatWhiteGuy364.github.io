<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Secure Terminal</title>
    <style>
      body {
        margin: 0;
        padding: 20px;
        background-color: #050505;
        color: #00ff41;
        font-family: "Courier New", Courier, monospace;
        font-size: 16px;
        overflow-x: hidden;
      }
      #blog {
        display: none;
        margin-top: 30px;
        border: 1px solid #00ff41;
        padding: 20px;
        background-color: #000;
        max-width: 800px;
        box-shadow: 0 0 10px #00ff41;
      }
      h1 {
        margin-top: 0;
        text-transform: uppercase;
        border-bottom: 1px dashed #00ff41;
        padding-bottom: 10px;
        font-size: 1.5em;
      }
      .cursor {
        display: inline-block;
        width: 10px;
        height: 1.2em;
        background-color: #00ff41;
        animation: blink 1s step-end infinite;
        vertical-align: bottom;
      }
      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0;
        }
      }
      #input-container {
        display: flex;
        align-items: center;
        margin-top: 10px;
      }
      #prefix {
        margin-right: 10px;
        font-weight: bold;
      }
      #current-input {
        white-space: pre;
      }
      .log-entry {
        margin-bottom: 5px;
      }
    </style>
  </head>
  <body>
    <div id="output"></div>
    <div id="input-container">
      <span id="prefix">password:</span>
      <span id="current-input"></span><span class="cursor"></span>
    </div>
    <div id="blog">
      <h1>The Grand Archives</h1>
      <p>Log 001: The architectural integrity of this node remains absolute.</p>
      <p>Operations proceed within the established parameters. The aether yields unto our commands.</p>
    </div>
    <script>
      const output = document.getElementById("output");
      const currentInput = document.getElementById("current-input");
      const prefix = document.getElementById("prefix");
      const blog = document.getElementById("blog");
      const targetHash =
        "ef797c8118f02dfb649607dd5d3f8c7623048c9c063d532cc95c5ed7a898a64f";
      let buffer = "";
      let isAuthenticated = false;
      async function hashString(str) {
        const encoder = new TextEncoder();
        const data = encoder.encode(str);
        const hashBuffer = await crypto.subtle.digest("SHA-256", data);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map((b) => b.toString(16).padStart(2, "0")).join("");
      }
      function appendLog(text) {
        const div = document.createElement("div");
        div.className = "log-entry";
        div.textContent = text;
        output.appendChild(div);
      }
      document.addEventListener("keydown", async (e) => {
        if (e.key === "Enter") {
          if (!isAuthenticated) {
            appendLog("password: " + "*".repeat(buffer.length));
            const hash = await hashString(buffer);
            if (hash === targetHash) {
              isAuthenticated = true;
              prefix.textContent = "root@whitelabs:~#";
              blog.style.display = "block";
              appendLog("Access granted.");
            } else {
              appendLog("Access denied.");
            }
          } else {
            if (buffer.trim() !== "") {
              appendLog("root@whitelabs:~# " + buffer);
              appendLog(
                "HAH! LOL! Imagine someone actually leaving a backdoor like this actually wide open 🤣"
              );
            }
          }
          buffer = "";
          currentInput.textContent = "";
          window.scrollTo(0, document.body.scrollHeight);
        } else if (e.key === "Backspace") {
          buffer = buffer.slice(0, -1);
          currentInput.textContent = isAuthenticated
            ? buffer
            : "*".repeat(buffer.length);
        } else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
          buffer += e.key;
          currentInput.textContent = isAuthenticated
            ? buffer
            : "*".repeat(buffer.length);
        }
      });
    </script>
  </body>
</html>
