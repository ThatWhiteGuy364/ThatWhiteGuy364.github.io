<!doctype html>
<html>
  <head>
    <title>Ultra-Fast Brute Force</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: #1a1a1a;
        color: #00ff00;
        padding: 40px;
      }
      .container {
        max-width: 600px;
        margin: auto;
        border: 1px solid #333;
        padding: 20px;
        border-radius: 8px;
        background: #222;
      }
      input,
      select {
        width: 100%;
        padding: 10px;
        margin: 10px 0;
        background: #333;
        border: 1px solid #444;
        color: #fff;
        box-sizing: border-box;
      }
      button {
        width: 100%;
        padding: 12px;
        background: #008800;
        color: white;
        border: none;
        cursor: pointer;
        font-weight: bold;
        margin-top: 10px;
      }
      button:hover {
        background: #00aa00;
      }
      #log {
        margin-top: 20px;
        font-family: monospace;
        font-size: 14px;
        color: #888;
        word-break: break-all;
        line-height: 1.6;
      }
      label {
        font-size: 14px;
        color: #aaa;
      }
      .stats {
        color: #00bfff;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Turbo Cracker</h2>
      <label for="mode">Target Type:</label>
      <select id="mode">
        <option value="plain">Plaintext Password</option>
        <option value="hash" selected>SHA-256 Hash (Hex)</option>
      </select>
      <input
        type="text"
        id="target"
        placeholder="Enter password or SHA-256 hash"
        value="2d2370db2447ff8cf4f3accd68c85aa119a9c893effd200a9b69176e9fc5eb98"
      />
      <button onclick="start()">Launch Attack</button>
      <div id="log">Ready. Using <span id="cores"></span> threads.</div>
    </div>

    <!-- Web Worker Script Block -->
    <script id="worker" type="javascript/worker">
      const K = new Uint32Array([
          0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
          0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
          0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
          0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
          0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
          0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
          0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
          0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2
      ]);

      const W = new Uint32Array(64);
      const BLOCK_U32 = new Uint32Array(16);
      const BLOCK_U8  = new Uint8Array(BLOCK_U32.buffer);

      let T0=0, T1=0, T2=0, T3=0, T4=0, T5=0, T6=0, T7=0;
      let plainTargetBytes = null;

      self.onmessage = function(e) {
          const { chars, target, startCharIdx, numThreads, mode } = e.data;

          const charCodes = new Uint8Array(chars.length);
          for(let i = 0; i < chars.length; i++) {
              charCodes[i] = chars.charCodeAt(i);
          }
          const n = charCodes.length;

          if (mode === 'plain') {
              plainTargetBytes = new Uint8Array(target.length);
              for(let i = 0; i < target.length; i++) {
                  plainTargetBytes[i] = target.charCodeAt(i);
              }
          } else {
              const cleanHash = target.toLowerCase().trim();
              T0 = parseInt(cleanHash.slice(0, 8), 16) >>> 0;
              T1 = parseInt(cleanHash.slice(8, 16), 16) >>> 0;
              T2 = parseInt(cleanHash.slice(16, 24), 16) >>> 0;
              T3 = parseInt(cleanHash.slice(24, 32), 16) >>> 0;
              T4 = parseInt(cleanHash.slice(32, 40), 16) >>> 0;
              T5 = parseInt(cleanHash.slice(40, 48), 16) >>> 0;
              T6 = parseInt(cleanHash.slice(48, 56), 16) >>> 0;
              T7 = parseInt(cleanHash.slice(56, 64), 16) >>> 0;
          }

          // Process variable lengths sequentially
          for (let currentLength = 1; currentLength <= 16; currentLength++) {
              if (startCharIdx === 0) {
                  self.postMessage({ status: true, length: currentLength });
              }

              const indices = new Int32Array(currentLength);

              // Key Correction: Thread division happens across the initial array configuration matrix offset safely
              indices[0] = startCharIdx;
              if (indices[0] >= n) continue;

              let hashCount = 0;
              let working = true;

              while (working) {
                  // Transfer generated combinations to system registers
                  for (let i = 0; i < currentLength; i++) {
                      BLOCK_U8[i] = charCodes[indices[i]];
                  }

                  if (mode === 'plain') {
                      if (currentLength === plainTargetBytes.length) {
                          let match = true;
                          for (let i = 0; i < currentLength; i++) {
                              if (BLOCK_U8[i] !== plainTargetBytes[i]) { match = false; break; }
                          }
                          if (match) {
                              self.postMessage({ found: true, result: target });
                              return;
                          }
                      }
                  } else {
                      // Clear block memory
                      for (let i = currentLength; i < 64; i++) BLOCK_U8[i] = 0;

                      BLOCK_U8[currentLength] = 0x80;

                      // Establish proper Big-Endian bit descriptors natively
                      const bits = currentLength << 3;
                      BLOCK_U8[63] = bits & 0xff;
                      BLOCK_U8[62] = (bits >>> 8) & 0xff;
                      BLOCK_U8[61] = (bits >>> 16) & 0xff;
                      BLOCK_U8[60] = (bits >>> 24) & 0xff;

                      for (let i = 0; i < 16; i++) {
                          const val = BLOCK_U32[i];
                          W[i] = ((val & 0xff000000) >>> 24) | ((val & 0x00ff0000) >>> 8) |
                                 ((val & 0x0000ff00) << 8)   | ((val & 0x000000ff) << 24);
                      }

                      for (let t = 16; t < 64; t++) {
                          const w15 = W[t - 15];
                          const g0 = ((w15 >>> 7) | (w15 << 25)) ^ ((w15 >>> 18) | (w15 << 14)) ^ (w15 >>> 3);
                          const w2 = W[t - 2];
                          const g1 = ((w2 >>> 17) | (w2 << 15)) ^ ((w2 >>> 19) | (w2 << 13)) ^ (w2 >>> 10);
                          W[t] = (g1 + W[t - 7] + g0 + W[t - 16]) >>> 0;
                      }

                      let a = 0x6a09e667, b = 0xbb67ae85, c = 0x3c6ef372, d = 0xa54ff53a,
                          e = 0x510e527f, f = 0x9b05688c, g = 0x1f83d9ab, h = 0x5be0cd19;

                      function round(t) {
                          const s1 = ((e >>> 6) | (e << 26)) ^ ((e >>> 11) | (e << 21)) ^ ((e >>> 25) | (e << 7));
                          const ch = (e & f) ^ (~e & g);
                          const t1 = (h + s1 + ch + K[t] + W[t]) >>> 0;
                          const s0 = ((a >>> 2) | (a << 30)) ^ ((a >>> 13) | (a << 19)) ^ ((a >>> 22) | (a << 10));
                          const maj = (a & b) ^ (a & c) ^ (b & c);
                          const t2 = (s0 + maj) >>> 0;
                          h = g; g = f; f = e; e = (d + t1) >>> 0;
                          d = c; c = b; b = a; a = (t1 + t2) >>> 0;
                      }

                      round(0);  round(1);  round(2);  round(3);  round(4);  round(5);  round(6);  round(7);
                      round(8);  round(9);  round(10); round(11); round(12); round(13); round(14); round(15);
                      round(16); round(17); round(18); round(19); round(20); round(21); round(22); round(23);
                      round(24); round(25); round(26); round(27); round(28); round(29); round(30); round(31);
                      round(32); round(33); round(34); round(35); round(36); round(37); round(38); round(39);
                      round(40); round(41); round(42); round(43); round(44); round(45); round(46); round(47);
                      round(48); round(49); round(50); round(51); round(52); round(53); round(54); round(55);
                      round(56); round(57); round(58); round(59); round(60); round(61); round(62); round(63);

                      if (((0x6a09e667 + a) >>> 0) === T0 && ((0xbb67ae85 + b) >>> 0) === T1 &&
                          ((0x3c6ef372 + c) >>> 0) === T2 && ((0xa54ff53a + d) >>> 0) === T3 &&
                          ((0x510e527f + e) >>> 0) === T4 && ((0x9b05688c + f) >>> 0) === T5 &&
                          ((0x1f83d9ab + g) >>> 0) === T6 && ((0x5be0cd19 + h) >>> 0) === T7) {

                          let matchStr = "";
                          for(let i = 0; i < currentLength; i++) matchStr += String.fromCharCode(BLOCK_U8[i]);
                          self.postMessage({ found: true, result: matchStr });
                          return;
                      }
                  }

                  hashCount++;
                  if (hashCount >= 250000) {
                      self.postMessage({ progress: hashCount });
                      hashCount = 0;
                  }

                  // Correct combination cascade algorithm: Allows full tracking across multidimensional index blocks
                  let idx = currentLength - 1;
                  while (idx >= 0) {
                      if (idx === 0) {
                          indices[0] += numThreads;
                          if (indices[0] >= n) working = false;
                          break;
                      } else {
                          indices[idx]++;
                          if (indices[idx] >= n) {
                              indices[idx] = 0;
                              idx--;
                          } else {
                              break;
                          }
                      }
                  }
              }
              if (hashCount > 0) {
                  self.postMessage({ progress: hashCount });
              }
          }
          self.postMessage({ done: true });
      };
    </script>

    <script>
      const chars = "abcdefghijklmnopqrstuvwxyz0123456789";
      const numThreads = navigator.hardwareConcurrency || 4;
      document.getElementById("cores").innerText = numThreads;

      let workers = [];
      let totalHashesChecked = 0;
      let statsInterval = null;
      let currentLenTrack = 1;

      function start() {
        stopAll();
        const target = document.getElementById("target").value;
        const mode = document.getElementById("mode").value;
        if (!target) return;

        const log = document.getElementById("log");
        const startTime = performance.now();
        totalHashesChecked = 0;
        currentLenTrack = 1;

        let lastChecked = 0;
        statsInterval = setInterval(() => {
          const delta = totalHashesChecked - lastChecked;
          lastChecked = totalHashesChecked;

          const hpsStr = delta.toLocaleString();
          const totalStr = totalHashesChecked.toLocaleString();

          log.innerHTML =
            `Cracking length ${currentLenTrack}...<br>` +
            `Speed: <span class="stats">${hpsStr} HPS</span><br>` +
            `Total Guesses: <span>${totalStr}</span>`;
        }, 1000);

        const blob = new Blob([document.getElementById("worker").textContent], {
          type: "text/javascript",
        });
        const url = URL.createObjectURL(blob);

        for (let i = 0; i < numThreads; i++) {
          const w = new Worker(url);
          workers.push(w);
          w.onmessage = (e) => {
            if (e.data.status && i === 0) {
              currentLenTrack = e.data.length;
            }
            if (e.data.progress) {
              totalHashesChecked += e.data.progress;
            }
            if (e.data.found) {
              const time = ((performance.now() - startTime) / 1000).toFixed(2);
              clearInterval(statsInterval);
              log.innerHTML =
                `<span style="color:#00ff00; font-size:16px; font-weight:bold;">` +
                `SUCCESS! Found: "${e.data.result}" in ${time}s<br>` +
                `Total evaluated hashes: ${totalHashesChecked.toLocaleString()}</span>`;
              stopAll();
            }
          };
          w.postMessage({ chars, target, startCharIdx: i, numThreads, mode });
        }
      }

      function stopAll() {
        if (statsInterval) clearInterval(statsInterval);
        workers.forEach((w) => w.terminate());
        workers = [];
      }
    </script>
  </body>
</html>
