      #JODINEtree {
        max-width: 80%;
        max-height: 250px;
        height: auto;
        margin: 20px 0;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      }

      .progress-container {
        width: 80%;
        max-width: 400px;
        margin: 15px 0;
      }

      progress {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 20px;
      }

      progress::-webkit-progress-bar {
        background-color: rgba(255, 255, 255, 0.2);
        border-radius: 10px;
      }

      progress::-webkit-progress-value {
        background-color: #ff4d6d;
        border-radius: 10px;
        transition: width 0.3s ease;
      }

      .click-btn {
        padding: 15px 35px;
        font-family: "ZakWriting", cursive;
        font-size: 1.8rem;
        cursor: pointer;
        background-color: #ff4d6d;
        color: white;
        border: none;
        border-radius: 15px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        transition: transform 0.1s;
      }

      .click-btn:active {
        transform: scale(0.9) translateY(-10px);
      }

      #finalMessage {
        opacity: 0;
        transform: scale(0.8);
        transition: all 1.5s ease-in-out;
        margin: 20px 0;
      }

      #finalMessage.show {
        opacity: 1;
        transform: scale(1.1);
      }

      for-love {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: -1;
        pointer-events: none;
      }
    </style>

      // Initialize YouTube Player
      function onYouTubeIframeAPIReady() {
        player = new YT.Player("player", {
          height: "0",
          width: "0",
          videoId: "9LW9DpmhrPE",
          playerVars: { autoplay: 0, controls: 0 },
        });
      }

      function chinky() {
        createHeart();
        clicks++;
        if (clicks === 255 && player && player.playVideo) {
          player.playVideo();
        }
        if (navigator.vibrate) {
          navigator.vibrate(10); // Short pulse
        }
        const intensity = (clicks / 255) * 40;
        const btn = document.querySelector(".click-btn");
        btn.style.boxShadow = `0 0 ${intensity}px #ff4d6d`;
        // Update UI
        document.getElementById("counter").innerText = clicks;
        document.getElementById("clickProgress").value = clicks;

        let img = document.getElementById("JODINEtree");

        // Change Image
        if (stages[clicks]) {
          img.src = stages[clicks];
        }

        // Final Celebration
        if (clicks === 255) {
          //CHANGE
          document.getElementById("finalMessage").classList.add("show");

          // Fire Confetti
          const duration = 5 * 1000;
          const end = Date.now() + duration;

          (function frame() {
            confetti({
              particleCount: 3,
              angle: 60,
              spread: 55,
              origin: { x: 0 },
              colors: ["#ff4d6d", "#ffffff"],
            });
            confetti({
              particleCount: 3,
              angle: 120,
              spread: 55,
              origin: { x: 1 },
              colors: ["#ff4d6d", "#ffffff"],
            });

            if (Date.now() < end) {
              requestAnimationFrame(frame);
            }
          })();
        }
      }
    </script>
